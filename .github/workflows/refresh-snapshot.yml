name: Refresh backup snapshot

# The page reads live data in the visitor's browser. This job keeps
# snapshot.json fresh as a fallback for when a government feed is down.
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snapshot
        run: python tools/build_snapshot.py snapshot.json
      - name: Commit if changed
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json
          git diff --cached --quiet || git commit -m "Refresh data snapshot"
          git push
